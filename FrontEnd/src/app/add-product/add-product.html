<div class="page-container">
  <h1>Add a New Product</h1>
  
  <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="product-form">
    <div class="form-group">
      <label for="nom">Product Name:</label>
      <input 
        type="text" 
        id="nom" 
        formControlName="nom"
        placeholder="Enter product name"
        class="form-control"
      >
      <div class="error-message" *ngIf="productForm.get('nom')?.invalid && productForm.get('nom')?.touched">
        Product name is required
      </div>
    </div>

    <div class="form-group">
      <label for="prix">Price (€):</label>
      <input 
        type="number" 
        id="prix" 
        formControlName="prix"
        placeholder="0"
        class="form-control"
      >
      <div class="error-message" *ngIf="productForm.get('prix')?.invalid && productForm.get('prix')?.touched">
        Price must be a positive number
      </div>
    </div>

    <div class="form-group">
      <label for="quantite">Quantity:</label>
      <input 
        type="number" 
        id="quantite" 
        formControlName="quantite"
        placeholder="0"
        class="form-control"
      >
      <div class="error-message" *ngIf="productForm.get('quantite')?.invalid && productForm.get('quantite')?.touched">
        Quantity must be a positive number
      </div>
    </div>

    <div class="form-group">
      <label for="imageUrl">Image URL:</label>
      <input 
        type="text" 
        id="imageUrl" 
        formControlName="imageUrl"
        placeholder="Enter image URL"
        class="form-control"
      >
      <div class="error-message" *ngIf="productForm.get('imageUrl')?.invalid && productForm.get('imageUrl')?.touched">
        Image URL is required
      </div>
    </div>

    <div class="form-group">
      <label for="type">Product Type:</label>
      <select 
        id="type" 
        formControlName="type"
        class="form-control"
      >
        <option value="team-merchandise">Team Merchandise</option>
        <option value="driver-gear">Driver Gear</option>
        <option value="collectibles">Collectibles</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="productForm.invalid" class="submit-button">
        Add
      </button>
      <button type="button" (click)="onCancel()" class="cancel-button">
        Cancel
      </button>
    </div>
  </form>
</div>
