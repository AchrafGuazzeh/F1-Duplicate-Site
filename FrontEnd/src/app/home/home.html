<div class="home-container">
  <section class="hero-section">
    <video class="hero-video" autoplay muted loop playsinline>
      <source src="assets/videos/Race Highlights _ 2025 Abu Dhabi Grand Prix.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Welcome to F1 Racing</h1>
      <p>Experience the thrill of Formula 1 racing</p>
      <div class="hero-buttons">
        <a routerLink="/schedule" class="btn btn-primary">View Schedule</a>
        <a routerLink="/tickets" class="btn btn-secondary">Get Tickets</a>
      </div>
    </div>
  </section>

  <section class="news-section">
    <div class="section-header">
      <h2 class="section-title">Latest F1 News</h2>
      <button class="manage-news-btn" (click)="goToManageNews()">Manage News</button>
    </div>
    <div class="news-grid" *ngIf="newsList.length > 0">
      <article class="news-card" *ngFor="let news of newsList">
        <div class="news-content">
          <h3>{{ news.title }}</h3>
          <p class="news-date">{{ news.date }}</p>
          <p class="news-excerpt">{{ news.description }}</p>
          <a routerLink="/news" class="read-more">Read More →</a>
        </div>
      </article>
    </div>
    <div class="empty-news" *ngIf="newsList.length === 0">
      <p>No news available. Click "Manage News" to add articles.</p>
    </div>
  </section>
</div>
