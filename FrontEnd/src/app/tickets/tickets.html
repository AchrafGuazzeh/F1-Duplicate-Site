<div class="page-container">
  <h1>Get Your F1 Tickets</h1>
  <div class="tickets-container">
    <div class="ticket-type" (click)="navigateToTicketList('weekend-pass')">
      <h3>Weekend Passes</h3>
      <p>Full access to all race weekend activities</p>
      <button class="btn">Buy Now</button>
    </div>
    <div class="ticket-type" (click)="navigateToTicketList('grandstand')">
      <h3>Grandstand Seats</h3>
      <p>Reserved seating with excellent views</p>
      <button class="btn">Buy Now</button>
    </div>
  </div>
</div>
